# XL — very large files (§7.2). Spec sizes 10 MiB / 100 MiB / 1 GiB; POC 10 MiB / 100 MiB.

[[test]]
id = "XL-01..06"
family = "XL"
kind = "xl"
reps = 1
note = "create, full read (MB/s), read_lines at 0/50/100 %, replace 3 lines at 0/50/100 % (write amplification), 100 sequential replaces (footprint growth per edit), history + read_version(v1)"
[test.spec]
sizes = [10485760, 104857600, 1073741824]
positions = [0.0, 0.5, 1.0]
read_lines = 50
edit_lines = 3
sequential_edits = 100
[test.poc]
sizes = [10485760, 104857600]
sequential_edits = 30
# XL picks which document sizes to exercise, so the scale factor must not shrink them:
# each size is a deliberate point (10 MiB / 100 MiB / 1 GiB), not a volume dial. These
# tables select points instead. A full-copy-history baseline stores every version whole,
# so 100 MiB x 30 edits is ~3 GB on `sql-text-*` alone.
[test.xs]
sizes = [1048576]
[test.s]
sizes = [10485760]
[test.l]
sizes = [10485760, 104857600, 1073741824]

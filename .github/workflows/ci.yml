name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rclone for the rclone asset store tests, which must run here rather than skip.
      - run: |
          curl -sSL -o /tmp/rclone.zip https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip
          mkdir -p "$HOME/.local/rclone" && unzip -q -j /tmp/rclone.zip '*/rclone' -d "$HOME/.local/rclone"
          echo "TEXTDB_RCLONE=$HOME/.local/rclone/rclone" >> "$GITHUB_ENV"
          echo "TEXTDB_REQUIRE_RCLONE=1" >> "$GITHUB_ENV"
      - run: cargo build --workspace --release
      - run: cargo test --workspace --release
      # The workspace build unifies Cargo features across its members, which hides a
      # member whose own feature list is incomplete. Build the two SQLite crates on their
      # own so a missing feature fails here rather than in someone's install.
      - run: cargo build --release -p textdb-sqlite
      - run: cd crates/textdb-sqlite-ext && cargo build --release
      # The loadable extension is the artefact INSTALL.md and the Python library use, so
      # check it actually loads and answers, not just that it links.
      - run: python3 python/tests/load_extension_smoke.py
      - run: python3 -m pip install --quiet pytest
      - run: python3 -m pytest tests -q
        working-directory: python
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/textdb-sqlite-ext -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The server reads the store through the SQLite extension and runs the CLI for sync and assets.
      - run: cargo build --release -p textdb-cli
      - run: cd crates/textdb-sqlite-ext && cargo build --release
      - run: npm ci
        working-directory: node/packages/textdb
      - run: npm ci
        working-directory: node/apps/server
      - run: npm run typecheck
        working-directory: node/apps/server
      - run: npm test
        working-directory: node/apps/server
      - run: npm ci
        working-directory: node/apps/web
      - run: npm run typecheck
        working-directory: node/apps/web
      - run: npx vitest run
        working-directory: node/apps/web
  pg-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/textdb-pg -> target
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-server-dev-16 libclang-dev
      - run: cargo install cargo-pgrx --version 0.18.1 --locked
      - run: cargo pgrx init --pg16 /usr/lib/postgresql/16/bin/pg_config
      # `cargo pgrx test` and `install` write the extension into the system PostgreSQL's directories.
      - run: sudo chmod a+rwx "$(/usr/lib/postgresql/16/bin/pg_config --pkglibdir)" "$(/usr/lib/postgresql/16/bin/pg_config --sharedir)/extension" /var/run/postgresql/
      - run: cd crates/textdb-pg && cargo build --release
      # The extension's own tests (#[pg_test]), in a scratch cluster pgrx starts.
      - run: cd crates/textdb-pg && cargo pgrx test pg16
      # The CLI against the extension installed in the runner's PostgreSQL 16.
      - run: cd crates/textdb-pg && cargo pgrx install --release --pg-config /usr/lib/postgresql/16/bin/pg_config
      - run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE ci LOGIN SUPERUSER PASSWORD 'ci'"
      - run: cargo test --release -p textdb-cli --test cli_pg
        env:
          TEXTDB_TEST_PG: postgres://ci:ci@localhost:5432/postgres
      # A crashed backend shows only as a closed connection in the tests; the server log says which
      # statement it was running.
      - if: failure()
        run: sudo tail -n 200 /var/log/postgresql/postgresql-16-main.log

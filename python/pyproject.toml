[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textdb"
version = "0.1.0"
description = "Versioned text corpora in SQL (textdb) with swappable Postgres / SQLite backends"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
test = ["pytest>=7", "psycopg2-binary>=2.9"]

[project.scripts]
textdb = "textdb.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["textdb*"]

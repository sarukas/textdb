[workspace]
resolver = "2"
members = [
    "crates/textdb-core",
    "crates/textdb-md",
    "crates/textdb-sqlite",
    "crates/textdb-cli",
    "bench/harness",
]
# textdb-pg is a pgrx extension and is built separately (see docs/INSTALL.md); it is excluded
# so `cargo test` does not require a Postgres toolchain. textdb-sqlite-ext is the loadable
# SQLite extension: it needs rusqlite's `loadable_extension` feature, which cannot coexist
# with `bundled` in one build graph, so it is built on its own too.
exclude = ["crates/textdb-pg", "crates/textdb-sqlite-ext"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sarukas/textdb"

[workspace.dependencies]
blake3 = "1.8"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: JSON objects keep the order their fields were written in, so a listing
# row reads in the canonical Entry order rather than alphabetically, and front matter keeps
# the key order the document had.
serde_json = { version = "1", features = ["preserve_order"] }
proptest = "1.11"
rand = "0.8"
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled", "vtab", "functions"] }
pulldown-cmark = { version = "0.13", default-features = false }
similar = { version = "2.7", features = ["bytes"] }

[profile.release]
debug = 1

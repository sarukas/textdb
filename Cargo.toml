[workspace]
resolver = "2"
members = [
    "crates/textdb-core",
    "crates/textdb-md",
    "crates/textdb-sqlite",
    "bench/harness",
]
# textdb-pg is a pgrx extension and is built separately (see crates/textdb-pg/README.md);
# it is excluded from the default workspace so `cargo test` does not require a Postgres toolchain.
exclude = ["crates/textdb-pg"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sarukas/textdb"

[workspace.dependencies]
blake3 = "1.8"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1.11"
rand = "0.8"
rusqlite = { version = "0.40", features = ["bundled", "vtab", "functions", "blob"] }
pulldown-cmark = { version = "0.13", default-features = false }
similar = { version = "2.7", features = ["bytes"] }

[profile.release]
debug = 1

[package]
name = "textdb-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite binding for textdb: shadow tables, virtual table, table-valued functions, FTS5"

[features]
default = ["bundled"]
# Compile SQLite in (library / CLI / harness use).
bundled = ["rusqlite/bundled"]
# Build as part of a loadable SQLite extension (see crates/textdb-sqlite-ext).
loadable_extension = ["rusqlite/loadable_extension"]

[dependencies]
textdb-core = { path = "../textdb-core" }
textdb-md = { path = "../textdb-md" }
rusqlite = { version = "0.40", default-features = false, features = ["cache", "vtab", "functions"] }
serde_json = { workspace = true }
# Bearer tokens (#12): sha2 hashes them for storage, rand mints them.
rand = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3"

[package]
name = "textdb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line for textdb stores (SQLite and Postgres), for agents and people"

[[bin]]
name = "textdb"
path = "src/main.rs"

[dependencies]
textdb-core = { path = "../textdb-core" }
textdb-sqlite = { path = "../textdb-sqlite" }
textdb-md = { path = "../textdb-md" }
rusqlite = { workspace = true }
postgres = "0.19"
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = "0.1"
sha1 = "0.11"
regex = "1"
ignore = "0.4"
sha2 = "0.11"
uuid = { version = "1", features = ["v7"] }


# The #12 acceptance catalogue is written before the feature and is red until it lands, so it
# is not part of the default test run. Run it with `--features access-tests`.
[features]
access-tests = []

[[test]]
name = "access"
required-features = ["access-tests"]

[dev-dependencies]
tempfile = "3"
# The sync-base test stands in for another machine by writing to the store directly.
rusqlite = { workspace = true }


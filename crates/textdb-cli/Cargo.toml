[package]
name = "textdb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line for textdb stores (SQLite and Postgres), for agents and people"

[[bin]]
name = "textdb"
path = "src/main.rs"

[dependencies]
textdb-core = { path = "../textdb-core" }
textdb-sqlite = { path = "../textdb-sqlite" }
textdb-md = { path = "../textdb-md" }
rusqlite = { workspace = true }
postgres = "0.19"
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = "0.1"
sha1 = "0.11"
regex = "1"

[dev-dependencies]
tempfile = "3"

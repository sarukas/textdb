[package]
name = "textdb-sqlite-ext"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Loadable SQLite extension (.so) exposing the textdb virtual table and functions"

[lib]
name = "textdb_sqlite_ext"
crate-type = ["cdylib"]

[dependencies]
textdb-sqlite = { path = "../textdb-sqlite", default-features = false, features = ["loadable_extension"] }
rusqlite = { version = "0.40", default-features = false, features = ["vtab", "functions", "loadable_extension"] }
